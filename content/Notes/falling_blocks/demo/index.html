<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Games in Rust · Shota Ikari</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #27272a; color: #fafafa; font-family: system-ui, sans-serif; }
      #glcanvas { position: absolute; left: 50%; top: 50%; width: 548px; height: 656px; }
      #glcanvas:focus-visible { outline: 2px solid #a78bfa; outline-offset: -2px; }
      #start-screen { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 20px; background: #27272a; }
      #start-screen[hidden] { display: none; }
      button { padding: 12px 24px; border: 0; border-radius: 6px; background: #a78bfa; color: #18181b; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #fafafa; outline-offset: 4px; }
      button:disabled { cursor: wait; }
      p { max-width: 30ch; line-height: 1.6; }
    </style>
    <script src="game.js" defer></script>
  </head>
  <body>
    <canvas id="glcanvas" width="548" height="656" tabindex="0" hidden aria-label="Tetris-like falling-block puzzle. Enter to start or restart, left and right arrows to move, down arrow for soft drop, Space to drop or resume, up arrow or R to rotate right, E to rotate left, Shift to hold, Escape to pause, M to change theme.">
      Your browser needs canvas and WebAssembly support to play this game.
    </canvas>
    <div id="start-screen">
      <button id="play" type="button">Load game</button>
      <p id="status" role="status">Keyboard input is required.<br>After loading, press Enter to start.</p>
      <noscript><p>Enable JavaScript to play.</p></noscript>
    </div>
  </body>
</html>
